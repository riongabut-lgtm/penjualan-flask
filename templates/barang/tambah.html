{% extends 'base.html' %}

{% block content %}

<h2>Tambah Barang</h2>

<form method="POST">

<input
name="kode"
class="form-control mb-3"
placeholder="Kode Barang"
required>

<input
name="nama"
class="form-control mb-3"
placeholder="Nama Barang"
required>

<input
type="number"
name="harga"
class="form-control mb-3"
placeholder="Harga"
required>

<input
type="number"
name="stok"
class="form-control mb-3"
placeholder="Stok"
required>

<button class="btn btn-success">

Simpan

</button>

</form>

{% endblock %}
