<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SmartKasir</title>

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

<!-- AdminLTE -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">

<!-- DataTables -->
<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap4.min.css">

<style>

.small-box{

transition:.3s;

}

.small-box:hover{

transform:translateY(-5px);

box-shadow:0 15px 30px rgba(0,0,0,.15);

}

.card{

transition:.3s;

}

.card:hover{

transform:translateY(-3px);

box-shadow:0 10px 20px rgba(0,0,0,.12);

}

.btn{

border-radius:8px;

}

.table tbody tr:hover{

background:#f4f6f9;

}

</style>

</head>

<body class="hold-transition sidebar-mini layout-fixed">

<div class="wrapper">

<!-- ================= NAVBAR ================= -->

<nav class="main-header navbar navbar-expand navbar-white navbar-light">

<ul class="navbar-nav">

<li class="nav-item">

<a class="nav-link" data-widget="pushmenu" href="#">

<i class="fas fa-bars"></i>

</a>

</li>

<li class="nav-item">

<a href="{{ url_for('dashboard') }}" class="nav-link">

<i class="fas fa-home"></i>

Dashboard

</a>

</li>

<li class="nav-item">

<a href="{{ url_for('barang.index') }}" class="nav-link">

<i class="fas fa-bell"></i>

<span class="badge badge-danger">

{{ stok_menipis|default(0) }}

</span>

</a>

</li>

</ul>

<ul class="navbar-nav ml-auto">

<li class="nav-item">

<a href="{{ url_for('auth.logout') }}" class="nav-link">

<i class="fas fa-sign-out-alt"></i>

Logout

</a>

</li>

</ul>

</nav>

<!-- ================= SIDEBAR ================= -->

<aside class="main-sidebar sidebar-dark-primary elevation-4">

<a href="{{ url_for('dashboard') }}" class="brand-link">

<i class="fas fa-store ml-3"></i>

<span class="brand-text ml-2">

SmartKasir

</span>

</a>

<div class="sidebar">

<div class="user-panel mt-3 pb-3 mb-3 d-flex">

<div class="image">

<img src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/img/user2-160x160.jpg"
class="img-circle elevation-2">

</div>

<div class="info">

<a href="#" class="d-block">

Administrator

</a>

<small class="text-success">

● Online

</small>

</div>

</div>

<nav>

<ul class="nav nav-pills nav-sidebar flex-column">

<li class="nav-item">

<a href="{{ url_for('dashboard') }}" class="nav-link">

<i class="nav-icon fas fa-home"></i>

<p>Dashboard</p>

</a>

</li>

<li class="nav-item">

<a href="{{ url_for('barang.index') }}" class="nav-link">

<i class="nav-icon fas fa-box"></i>

<p>Barang</p>

</a>

</li>

<li class="nav-item">

<a href="{{ url_for('transaksi.index') }}" class="nav-link">

<i class="nav-icon fas fa-shopping-cart"></i>

<p>Transaksi</p>

</a>

</li>

<li class="nav-item">

<a href="{{ url_for('laporan.index') }}" class="nav-link">

<i class="nav-icon fas fa-chart-line"></i>

<p>Laporan</p>

</a>

</li>

</ul>

</nav>

</div>

</aside>

<!-- ================= CONTENT ================= -->

<div class="content-wrapper">

<section class="content pt-3">

<div class="container-fluid">

{% block content %}{% endblock %}

</div>

</section>

</div>

<!-- ================= FOOTER ================= -->

<footer class="main-footer text-center">

<strong>

SmartKasir v1.0

</strong>

|

Developed by

<b>RSK Minions</b>

</footer>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- AdminLTE -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<!-- DataTables -->
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap4.min.js"></script>

<!-- ChartJS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
